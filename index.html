<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CleanClik</title>
        <meta
            name="description"
            content="Report illegal dumps. Track cleanups. Keep your community clean."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
            rel="stylesheet"
        />
        <style>
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            :root {
                --bg: #080d08;
                --surface: #0f160f;
                --border: rgba(255, 255, 255, 0.07);
                --white: #ffffff;
                --secondary: rgba(255, 255, 255, 0.55);
                --muted: rgba(255, 255, 255, 0.28);
                --green: #4a9b5f;
                --green-dim: rgba(74, 155, 95, 0.12);
            }

            html,
            body {
                height: 100%;
            }

            body {
                font-family:
                    "Inter",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background: var(--bg);
                color: var(--white);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 3rem 1.5rem;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            /* ── Layout ── */
            .stage {
                width: 100%;
                max-width: 420px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3rem;
                animation: appear 1s cubic-bezier(0.16, 1, 0.3, 1) both;
            }

            /* ── Mark ── */
            .mark {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.25rem;
            }

            .mark-name {
                font-size: 1.75rem;
                font-weight: 500;
                letter-spacing: -0.04em;
                color: var(--white);
            }

            .mark-line {
                font-size: 0.9rem;
                font-weight: 400;
                color: var(--secondary);
                letter-spacing: 0.01em;
                line-height: 1.6;
                text-align: center;
                max-width: 300px;
            }

            /* ── Pulse indicator ── */
            .live {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 0.75rem;
                font-weight: 400;
                color: var(--muted);
                letter-spacing: 0.02em;
            }

            .live-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--green);
                animation: breathe 3s ease-in-out infinite;
            }

            /* ── Actions ── */
            .actions {
                display: flex;
                flex-direction: column;
                gap: 0.6rem;
                width: 100%;
            }

            .btn {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.6rem;
                width: 100%;
                padding: 0.9rem 1.5rem;
                border-radius: 14px;
                font-family: inherit;
                font-size: 0.875rem;
                font-weight: 500;
                letter-spacing: -0.01em;
                text-decoration: none;
                cursor: pointer;
                border: none;
                transition:
                    opacity 0.2s ease,
                    transform 0.2s ease;
                -webkit-tap-highlight-color: transparent;
            }

            .btn:hover {
                opacity: 0.84;
                transform: translateY(-1px);
            }
            .btn:active {
                opacity: 0.7;
                transform: translateY(0);
            }

            .btn svg {
                width: 17px;
                height: 17px;
                flex-shrink: 0;
                opacity: 0.9;
            }

            /* Primary — solid white */
            .btn-solid {
                background: var(--white);
                color: #0d120d;
            }

            /* Secondary — translucent */
            .btn-ghost {
                background: rgba(255, 255, 255, 0.06);
                color: var(--white);
                border: 1px solid var(--border);
            }

            /* Map — green tint */
            .btn-map {
                background: var(--green-dim);
                color: rgba(255, 255, 255, 0.85);
                border: 1px solid rgba(74, 155, 95, 0.22);
            }

            /* Donate — text-only */
            .btn-text {
                background: transparent;
                color: var(--muted);
                font-size: 0.8rem;
                padding: 0.6rem 1rem;
            }

            .btn-text:hover {
                opacity: 1;
                color: var(--secondary);
                transform: none;
            }

            .sep {
                width: 100%;
                height: 1px;
                background: var(--border);
                margin: 0.3rem 0;
            }

            /* ── Footer ── */
            footer {
                font-size: 0.72rem;
                color: var(--muted);
                text-align: center;
                line-height: 2;
                letter-spacing: 0.01em;
            }

            footer a {
                color: var(--muted);
                text-decoration: none;
            }

            footer a:hover {
                color: var(--secondary);
            }

            /* ── Animations ── */
            @keyframes appear {
                from {
                    opacity: 0;
                    transform: translateY(14px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes breathe {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.35;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                * {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body>
        <div class="stage">
            <!-- Identity -->
            <div class="mark">
                <span class="mark-name">CleanClik</span>
                <p class="mark-line">
                    Report illegal dumps. Track cleanups.<br />Keep your
                    community clean.
                </p>
            </div>

            <!-- Live signal -->
            <div class="live">
                <span class="live-dot"></span>
                Reports being added right now
            </div>

            <!-- CTAs -->
            <div class="actions">
                <a
                    href="https://play.google.com/store/apps/details?id=com.trashmapr.trashmapr"
                    target="_blank"
                    rel="noopener"
                    class="btn btn-solid"
                >
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M3.18 23.76c.3.17.64.22.97.15l12.5-7.21-2.79-2.79-10.68 9.85zm-1.87-20.5C1.12 3.6 1 4 1 4.5v15c0 .5.12.9.31 1.24l.07.07 8.4-8.4v-.2L1.38 3.19l-.07.07zM20.37 10.43l-2.67-1.54-3.12 3.12 3.12 3.12 2.68-1.55c.77-.44.77-1.16 0-1.6l-.01-.55zM4.16.23L16.66 7.44l-2.79 2.79L3.19.38c.32-.07.67-.02.97.15l.01-.3z"
                        />
                    </svg>
                    Get it on Google Play
                </a>

                <a
                    href="https://apps.apple.com/in/app/trashmapr/id6757869722"
                    target="_blank"
                    rel="noopener"
                    class="btn btn-ghost"
                >
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"
                        />
                    </svg>
                    Download on the App Store
                </a>

                <div class="sep"></div>

                <a
                    href="https://waste.watch"
                    target="_blank"
                    rel="noopener"
                    class="btn btn-map"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <polygon
                            points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"
                        />
                        <line x1="9" y1="3" x2="9" y2="18" />
                        <line x1="15" y1="6" x2="15" y2="21" />
                    </svg>
                    Open the Map
                </a>

                <a
                    href="https://waste.watch/donate"
                    target="_blank"
                    rel="noopener"
                    class="btn btn-text"
                >
                    Support the project
                </a>
            </div>
        </div>

        <footer>
            <a href="/trashmapr/privacy_policy.html">Privacy</a>
            &ensp;·&ensp;
            <a href="/trashmapr/terms_of_service.html">Terms</a>
            <br />© 2026 CleanClik
        </footer>
    </body>
</html>
