<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanClik</title>
    <meta name="description" content="Report illegal dumps. Track cleanups. Keep your community clean." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:        #090e09;
            --rule:      rgba(255,255,255,0.08);
            --white:     #f5f5f5;
            --secondary: rgba(245,245,245,0.5);
            --muted:     rgba(245,245,245,0.25);
            --green:     #4a9b5f;
            --green-dim: rgba(74,155,95,0.1);
            --radius:    8px;
        }

        html, body { height: 100%; }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--white);
            min-height: 100vh;
            display: grid;
            grid-template-rows: 1fr auto;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── Main ── */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5rem 2rem 3rem;
            animation: appear 0.8s cubic-bezier(0.16,1,0.3,1) both;
        }

        /* ── Identity ── */
        .identity {
            text-align: center;
            margin-bottom: 4rem;
        }

        .wordmark {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            color: var(--white);
            margin-bottom: 1rem;
        }

        .tagline {
            font-size: 0.825rem;
            font-weight: 400;
            color: var(--secondary);
            line-height: 1.7;
            letter-spacing: 0.005em;
        }

        /* ── Live signal ── */
        .signal {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .signal-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--green);
            flex-shrink: 0;
            animation: breathe 3s ease-in-out infinite;
        }

        /* ── Actions ── */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: 100%;
            max-width: 360px;
            margin-bottom: 2.5rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            width: 100%;
            padding: 0.875rem 1.25rem;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 0.825rem;
            font-weight: 500;
            letter-spacing: 0.005em;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover  { opacity: 0.8; transform: translateY(-1px); }
        .btn:active { opacity: 0.65; transform: translateY(0); }

        .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

        .btn-primary {
            background: var(--white);
            color: #0a0f0a;
        }

        .btn-secondary {
            background: transparent;
            color: rgba(245,245,245,0.7);
            border: 1px solid var(--rule);
        }

        .btn-map {
            background: var(--green-dim);
            color: rgba(245,245,245,0.8);
            border: 1px solid rgba(74,155,95,0.18);
        }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
            font-size: 0.775rem;
            letter-spacing: 0.01em;
        }

        .btn-ghost:hover { opacity: 1; color: var(--secondary); transform: none; }

        .rule {
            width: 100%;
            height: 1px;
            background: var(--rule);
            margin: 0.25rem 0;
        }

        /* ── Social ── */
        .social {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .social-link:hover { color: rgba(245,245,245,0.6); }

        .social-link svg { width: 18px; height: 18px; }

        /* ── Footer ── */
        footer {
            padding: 1.75rem 2rem;
            border-top: 1px solid var(--rule);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .footer-copy {
            font-size: 0.7rem;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        .footer-links {
            display: flex;
            gap: 1.25rem;
        }

        .footer-links a {
            font-size: 0.7rem;
            color: var(--muted);
            text-decoration: none;
            letter-spacing: 0.02em;
            transition: color 0.15s ease;
        }

        .footer-links a:hover { color: var(--secondary); }

        /* ── Animations ── */
        @keyframes appear {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes breathe {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.3; }
        }

        @media (max-width: 400px) {
            footer { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
